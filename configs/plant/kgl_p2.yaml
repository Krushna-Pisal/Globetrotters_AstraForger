  id: KGL-P2
  name: "Kaggle Plant 2 (India, measured)"
  source_kind: measured
  template: solar_pv_fixed_tilt@1
  source_plant_id: 4136001
  location: {lat: null, lon: null, tz: Asia/Kolkata}   # tz: timestamps are local (irradiance peaks at 12:00)
