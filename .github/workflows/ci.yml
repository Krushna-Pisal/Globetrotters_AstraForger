name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ps4
          POSTGRES_PASSWORD: ps4
          POSTGRES_DB: ps4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ps4 -d ps4" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://ps4:ps4@localhost:5432/ps4
      TEST_DATABASE_URL: postgresql+psycopg://ps4:ps4@localhost:5432/ps4_test
      JWT_SECRET: ci-only
      PYTHONPATH: ${{ github.workspace }}/services/api
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: alembic upgrade head
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build
