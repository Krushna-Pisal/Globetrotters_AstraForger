[project]
name = "ps4-api"
version = "0.1.0"
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt / requirements-dev.txt (installed by the Dockerfile and CI).

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]   # assert is how pytest works

[tool.ruff.lint.isort]
known-third-party = ["alembic"]   # the local alembic/ migrations folder is not the package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # demo secrets in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
markers = ["db: needs the PostgreSQL test database"]
